name: Release

on:
  push:
    branches:
      - main

env:
  NODE_VERSION: '22.22'
  PNPM_VERSION: '11.10.0'

jobs:
  release:
    name: Release with standard-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Run release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pnpx standard-version

      - name: Push changes and tags
        run: |
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git push origin main --follow-tags --force-with-lease

  docker-build-and-publish:
    name: Build and publish Docker image
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Read OpenBao secrets
        uses: hashicorp/vault-action@v4
        with:
          url: https://obao.linagora.com
          namespace: LPS/global
          method: approle
          roleId: ${{ secrets.BAO_CLIENT_ID }}
          secretId: ${{ secrets.BAO_CLIENT_TOKEN }}
          secrets: |
            secret/data/dockerhub USERNAME | DOCKERHUB_USERNAME ;
            secret/data/dockerhub TOKEN | DOCKERHUB_TOKEN

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Fetch all tags
        run: git fetch --tags

      - name: Get latest tag
        id: tag
        run: |
          TAG=$(git describe --tags --abbrev=0)
          echo "VERSION=$TAG" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/catalog-ui.Dockerfile
          push: true
          tags: |
            linagora/linid-catalog-ui:latest
            linagora/linid-catalog-ui:${{ steps.tag.outputs.VERSION }}
